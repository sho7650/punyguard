name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # create the Release and attach the zip
  pull-requests: write # open and update the Release PR
  issues: write # create and apply the release labels

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # GITHUB_TOKEN: the Release PR it opens does not trigger CI. The PR only changes
      # version numbers and the CHANGELOG (tasks/todo.md, Phase 5).
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  attach-zip:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile
      - name: Build
        run: nix develop --command pnpm run build
      # manifest.json sits at the root of the zip, as Chrome expects of an unpacked extension.
      - name: Zip dist/
        run: cd dist && zip -r "../punyguard-${TAG}.zip" .
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
      - name: Attach the zip to the Release
        run: gh release upload "$TAG" "punyguard-${TAG}.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
